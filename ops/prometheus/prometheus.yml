global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-gateway
    static_configs:
      # the gateway container inside the compose network
      - targets: ['gateway:3000']
      # a gateway run on the host (pnpm start:prod) is reachable here instead,
      # both targets stay listed so either mode works without editing this file
      - targets: ['host.docker.internal:3000']
